name: FirstJoinRTP
version: "${project.version}"
main: com.naipret.firstjoinrtp.FirstJoinRTP
api-version: "1.20"
description: Lightweight Bukkit/Paper plugin providing safe first-join RTP and spawnpoint setup.
author: naipret
website: https://github.com/naf-studio/firstjoinrtp-plugin
folia-supported: false

commands:
  firstjoinrtp:
    description: Manage FirstJoinRTP configuration.
    aliases: [fjrtp]
    permission: firstjoinrtp.admin
    usage: /<command> reload

permissions:
  firstjoinrtp.admin:
    description: Allows reloading the FirstJoinRTP configuration.
    default: op
