name: "Feature Request"
description: "Suggest a new configuration option, event listener, or plugin improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or improvement for FirstJoinRTP.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge, inconvenience, or missing feature does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed enhancement, command hook, or configuration property.
    validations:
      required: true
